[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; wireless upload: first flash once over USB, then `pio run -e ota -t upload` (same Wi-Fi as the laptop)
[env:ota]
extends = env:esp32dev
upload_protocol = espota
; polagrid-cell.local resolved to a wrong address on this PC (mDNS); use the ESP32 IP from the router (DHCP, may change)
; set upload_port to the ESP32 IP before use, e.g. 192.168.1.50
upload_port = <esp32-ip>

; Bluetooth SPP link instead of Wi-Fi (device "polagrid-cell"); the laptop runs sw/edge_ai/tools/bt_bridge.py. USB upload only.
[env:bt]
extends = env:esp32dev
build_flags = -DUSE_BT

; oneM2M over MQTT (esp-mqtt) instead of HTTP polling; see the MQTT design notes
[env:mqtt]
extends = env:esp32dev
build_flags = -DUSE_MQTT
