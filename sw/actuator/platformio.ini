[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; wireless upload: first flash once over USB, then `pio run -e ota -t upload` (same Wi-Fi as the laptop)
[env:ota]
extends = env:esp32dev
upload_protocol = espota
; polagrid-cell.local resolved to a wrong address on this PC (mDNS); use the ESP32 IP from the router (DHCP, may change)
upload_port = 192.168.68.138

; Bluetooth SPP link instead of Wi-Fi (device "polagrid-cell"); the laptop runs sw/edge_ai/tools/bt_bridge.py. USB upload only.
[env:bt]
extends = env:esp32dev
build_flags = -DUSE_BT
