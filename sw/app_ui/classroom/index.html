<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolaGrid virtual lecture room</title>
<!-- Offline 3D view of the simulated lecture room. No library, no server: open this file directly.
     Data: classroom_data.js, written by sw/edge_ai/tools/classroom_sim.py (simulated, not measured).
     URL params: ?lang=en, ?t=<step>, ?left=<method>&right=<method>, ?single=1, ?still=1 (no autoplay, for frame capture). -->
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --ink:#1d2330; --muted:#5b6475; --line:#d9dde5; --accent:#2f6fdf; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171d; --panel:#1d222b; --ink:#e8ebf1; --muted:#9aa3b5; --line:#2e3542; --accent:#6f9cff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, "Malgun Gothic", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  h1 { font-size:16px; margin:0; }
  .note { color:var(--muted); font-size:12px; }
  .views { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px 16px; }
  .views.single { grid-template-columns:1fr; }
  @media (max-width:800px) { .views { grid-template-columns:1fr; } }
  .view { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .view .bar { display:flex; justify-content:space-between; gap:8px; padding:6px 10px; border-bottom:1px solid var(--line); }
  .view select { font:inherit; max-width:60%; }
  canvas { display:block; width:100%; aspect-ratio:16/10; cursor:grab; touch-action:none; }
  .stats { display:grid; grid-template-columns:repeat(4, 1fr); gap:4px 8px; padding:6px 10px 10px; font-size:12px; }
  .stats b { display:block; font-size:16px; font-variant-numeric:tabular-nums; }
  .glare b { color:#d93a2b; }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:0 16px 12px; }
  .controls input[type=range] { flex:1; min-width:200px; }
  button { font:inherit; padding:4px 12px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); cursor:pointer; }
  .clock { font-size:20px; font-variant-numeric:tabular-nums; min-width:64px; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; padding:0 16px 14px; font-size:12px; color:var(--muted); }
  .sw { display:inline-block; width:12px; height:12px; border-radius:2px; vertical-align:-2px; margin-right:4px; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span class="note" id="note"></span>
  <button id="lang" type="button"></button>
</header>
<div class="views" id="views"></div>
<div class="controls">
  <button id="play" type="button"></button>
  <span class="clock" id="clock"></span>
  <input id="time" type="range" min="0" value="0" aria-label="time">
  <span class="note" id="sun"></span>
</div>
<div class="legend" id="legend"></div>
<script src="classroom_data.js"></script>
<script>
"use strict";
const D = window.CLASSROOM;
const Q = new URLSearchParams(location.search);
let lang = Q.get("lang") === "en" ? "en" : "ko";
const TXT = {
  ko: { title: "PolaGrid 가상 강의실: 손이 닿지 않는 높은 남향 창", note: "가상 시뮬레이션(물리 모델, 기상청 2025 서울 하늘). 측정값 아님.",
        play: "재생", pause: "멈춤", other: "English", alt: "해 고도", az: "방위", out: "창 바깥 조도",
        glareNow: "지금 눈부신 책상", glareDay: "오늘 눈부심 책상-시간", target: "목표 조도 유지(하루)", moves: "칸 이동 횟수(하루)",
        reach: "손이 닿는 높이 약 2.0 m", sill: "창 아래 2.2 m",
        legend: [["#d93a2b", "눈부심(책상 직사광 > 2,000 lux)"], ["#f2d27a", "책상 500 lux 이상"], ["#8a94a6", "책상 500 lux 미만"],
                 ["#bfe0ff", "칸 열림"], ["#203050", "칸 닫힘"], ["rgba(255,214,90,.7)", "바닥에 든 햇빛"]],
        names: { "No film, blind out of reach": "현재: 필름 없음, 블라인드 못 내림", "Cells fixed open": "칸 고정 개방",
                 "Time schedule 11-15 h": "시간 예약(11~15시 닫힘)", "PolaGrid AI (1)+(2) online": "PolaGrid AI ①+②",
                 "PolaGrid AI (3) predict": "PolaGrid AI ③ 예측" } },
  en: { title: "PolaGrid virtual lecture room: a high south window nobody can reach", note: "Simulation (physics model, KMA Seoul 2025 sky). Not measured.",
        play: "Play", pause: "Pause", other: "한국어", alt: "sun alt", az: "az", out: "outdoor on window",
        glareNow: "desks in glare now", glareDay: "glare desk-hours today", target: "target lux kept (day)", moves: "cell moves (day)",
        reach: "reach about 2.0 m", sill: "window sill 2.2 m",
        legend: [["#d93a2b", "glare (direct sun > 2,000 lux on desk)"], ["#f2d27a", "desk >= 500 lux"], ["#8a94a6", "desk < 500 lux"],
                 ["#bfe0ff", "cell open"], ["#203050", "cell closed"], ["rgba(255,214,90,.7)", "sun patch on floor"]],
        names: {} },
};
const label = n => TXT[lang].names[n] || n;
const METHODS = Object.keys(D.methods);
const N = D.times.length, R = D.room, STEP_H = 5 / 60;
const T_OPEN = 0.40, T_LEAK = 0.005;
const trans = (m, deg) => m.no_film ? 1 : T_OPEN * Math.cos(deg * Math.PI / 180) ** 2 + T_LEAK;

// --- tiny perspective camera (z up, window wall at y = 0, room interior y > 0) ---
const cam = { yaw: 0.55, pitch: 0.42, dist: 13.5, target: [0, 3.0, 1.4] };
function basis() {
  const cp = Math.cos(cam.pitch), t = cam.target;
  const pos = [t[0] + cam.dist * cp * Math.sin(cam.yaw), t[1] + cam.dist * cp * Math.cos(cam.yaw), t[2] + cam.dist * Math.sin(cam.pitch)];
  const f = norm(sub(t, pos)), r = norm(cross(f, [0, 0, 1])), u = cross(r, f);
  return { pos, f, r, u };
}
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a); return [a[0] / l, a[1] / l, a[2] / l]; };

function sunDir(i) {  // unit vector from the room toward the sun, same convention as physics.py
  const [alt, az] = D.sun[i], a = alt * Math.PI / 180, rel = (az - R.window_azimuth) * Math.PI / 180;
  return { out: Math.cos(a) * Math.cos(rel), x: Math.cos(a) * Math.sin(rel), z: Math.sin(a), alt };
}

function draw(canvas, name, i) {
  const m = D.methods[name], ctx = canvas.getContext("2d");
  const w = canvas.width = canvas.clientWidth * devicePixelRatio, h = canvas.height = canvas.clientHeight * devicePixelRatio;
  const B = basis(), F = w * 0.9, dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const P = p => { const d = sub(p, B.pos), z = dot(d, B.f); return z < 0.1 ? null : [w / 2 + F * dot(d, B.r) / z, h / 2 - F * dot(d, B.u) / z, z]; };
  const poly = (pts, fill, stroke) => {
    const s = pts.map(P); if (s.some(v => !v)) return;
    ctx.beginPath(); s.forEach((v, k) => k ? ctx.lineTo(v[0], v[1]) : ctx.moveTo(v[0], v[1])); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = devicePixelRatio; ctx.stroke(); }
  };
  const text = (p, s, color, size = 12) => { const v = P(p); if (!v) return;
    ctx.fillStyle = color; ctx.font = `${size * devicePixelRatio}px system-ui, "Malgun Gothic", sans-serif`; ctx.fillText(s, v[0], v[1]); };
  ctx.fillStyle = dark ? "#0f1218" : "#e9ecf1"; ctx.fillRect(0, 0, w, h);
  const hw = R.w / 2, s = sunDir(i), outdoor = D.outdoor[i];
  const tr = m.angles[i].map(a => trans(m, a));

  // floor and window wall
  poly([[-hw, 0, 0], [hw, 0, 0], [hw, R.d, 0], [-hw, R.d, 0]], dark ? "#2a2f38" : "#cfd4dc", null);
  poly([[-hw, 0, 0], [-hw, R.d, 0], [-hw, R.d, R.h], [-hw, 0, R.h]], dark ? "#262b33" : "#dde1e7", null);
  poly([[-hw, 0, 0], [hw, 0, 0], [hw, 0, R.h], [-hw, 0, R.h]], dark ? "#323844" : "#f0f1f4", dark ? "#444" : "#bbb");
  // window cells: light blue when open, dark when closed
  D.cells.forEach(([x0, x1, z0, z1], k) => {
    const o = Math.min(1, tr[k] / (T_OPEN + T_LEAK)), c = (a, b) => Math.round(a + (b - a) * o);
    poly([[x0, 0, z0], [x1, 0, z0], [x1, 0, z1], [x0, 0, z1]], `rgb(${c(32, 191)},${c(48, 224)},${c(80, 255)})`, m.no_film ? null : "rgba(0,0,0,.25)");
  });
  // reach line and sill label
  const sill = Math.min(...D.cells.map(c => c[2]));
  poly([[-hw, 0.01, 2.0], [hw, 0.01, 2.0], [hw, 0.01, 2.02], [-hw, 0.01, 2.02]], "#e07a2b", null);
  text([-hw + 0.1, 0.01, 1.75], TXT[lang].reach, "#e07a2b", 11);
  text([-hw + 0.1, 0.01, sill + 0.08], TXT[lang].sill, dark ? "#ccd" : "#334", 11);

  // sun patches on the floor: each cell's beam, strength by its transmission and the outdoor light
  if (s.alt > 0 && s.out > 0.02 && s.z > 0.02) {
    const v = P([-hw, 0, 0]); ctx.save();
    ctx.beginPath(); [[-hw, 0, 0], [hw, 0, 0], [hw, R.d, 0], [-hw, R.d, 0]].map(P).forEach((q, k) => q && (k ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])));
    ctx.closePath(); ctx.clip();
    const strength = Math.min(1, outdoor / 60000);
    D.cells.forEach(([x0, x1, z0, z1], k) => {
      const a = 0.85 * strength * Math.min(1, tr[k] / 0.6); if (a < 0.03) return;
      const land = (x, z) => { const kk = z / s.z; return [x - kk * s.x, kk * s.out, 0]; };
      poly([land(x0, z0), land(x1, z0), land(x1, z1), land(x0, z1)], `rgba(255,214,90,${a.toFixed(2)})`, null);
    });
    ctx.restore();
  }

  // desks, far ones first
  const order = D.desks.map((d, k) => k).sort((a, b) => P([D.desks[b][0], D.desks[b][1], 0])[2] - P([D.desks[a][0], D.desks[a][1], 0])[2]);
  for (const k of order) {
    const [cx, cy, dw, dd, dh] = D.desks[k], x0 = cx - dw / 2, x1 = cx + dw / 2, y0 = cy - dd / 2, y1 = cy + dd / 2;
    const lux = m.lux[i][k], glare = m.glare[i][k];
    const top = glare ? "#d93a2b" : lux >= D.target_lux ? "#f2d27a" : "#8a94a6";
    const side = dark ? "#4a4f5a" : "#9aa0aa";
    const faces = [[[x0, y1, 0], [x1, y1, 0], [x1, y1, dh], [x0, y1, dh]], [[x0, y0, 0], [x1, y0, 0], [x1, y0, dh], [x0, y0, dh]],
                   [[x0, y0, 0], [x0, y1, 0], [x0, y1, dh], [x0, y0, dh]], [[x1, y0, 0], [x1, y1, 0], [x1, y1, dh], [x1, y0, dh]]];
    const normals = [[0, 1, 0], [0, -1, 0], [-1, 0, 0], [1, 0, 0]];
    faces.forEach((f, j) => { if (dot(normals[j], sub(B.pos, f[0])) > 0) poly(f, side, "rgba(0,0,0,.3)"); });
    poly([[x0, y0, dh], [x1, y0, dh], [x1, y1, dh], [x0, y1, dh]], top, "rgba(0,0,0,.35)");
    if (glare) text([cx - 0.3, cy, dh + 0.15], `${(lux / 1000).toFixed(1)}k lux`, "#d93a2b", 10);
  }

  // sun marker in the sky behind the window, with the beam direction
  if (s.alt > 0) {
    const c = [0, -8 * s.out, sill + 0.75 + 8 * s.z], q = P([c[0] + 8 * s.x, c[1], c[2]]);
    if (q) { ctx.fillStyle = "rgba(255,190,40,.95)"; ctx.beginPath(); ctx.arc(q[0], q[1], 9 * devicePixelRatio, 0, 7); ctx.fill(); }
  }
}

// --- page ---
const views = document.getElementById("views"), slider = document.getElementById("time");
slider.max = N - 1;
const single = Q.get("single") === "1";
const picks = [Q.get("left") || METHODS[0], Q.get("right") || METHODS.find(n => n.includes("(1)+(2)")) || METHODS[1]].slice(0, single ? 1 : 2);
if (single) views.classList.add("single");
const panes = picks.map(pick => {
  const el = document.createElement("div"); el.className = "view";
  el.innerHTML = `<div class="bar"><select></select><span class="note"></span></div><canvas></canvas><div class="stats"></div>`;
  views.appendChild(el);
  const sel = el.querySelector("select");
  sel.onchange = () => render();
  return { sel, canvas: el.querySelector("canvas"), stats: el.querySelector(".stats"), pick };
});
function fill() {
  for (const p of panes) {
    const cur = p.sel.value || p.pick;
    p.sel.innerHTML = METHODS.map(n => `<option value="${n}">${label(n)}</option>`).join("");
    p.sel.value = METHODS.includes(cur) ? cur : METHODS[0];
  }
}
let i = Math.max(0, Math.min(N - 1, +(Q.get("t") || D.times.indexOf("09:00"))));
function render() {
  const L = TXT[lang];
  slider.value = i;
  document.getElementById("clock").textContent = D.times[i];
  document.getElementById("sun").textContent = `${L.alt} ${D.sun[i][0]}°, ${L.az} ${D.sun[i][1]}°, ${L.out} ${D.outdoor[i].toLocaleString()} lux`;
  for (const p of panes) {
    const name = p.sel.value, m = D.methods[name];
    draw(p.canvas, name, i);
    let gh = 0; for (let k = 0; k <= i; k++) gh += m.glare[k].reduce((a, b) => a + b, 0) * STEP_H;
    const now = m.glare[i].reduce((a, b) => a + b, 0);
    p.stats.innerHTML = `<div class="${now ? "glare" : ""}">${L.glareNow}<b>${now} / ${D.desks.length}</b></div>` +
      `<div>${L.glareDay}<b>${gh.toFixed(1)} h</b></div>` +
      `<div>${L.target}<b>${Math.round(m.day.target * 100)}%</b></div><div>${L.moves}<b>${m.day.moves}</b></div>`;
  }
}
function setLang() {
  const L = TXT[lang]; document.documentElement.lang = lang;
  document.getElementById("title").textContent = L.title;
  document.getElementById("note").textContent = `${L.note} ${D.day}`;
  document.getElementById("lang").textContent = L.other;
  document.getElementById("play").textContent = timer ? L.pause : L.play;
  document.getElementById("legend").innerHTML = L.legend.map(([c, t]) => `<span><span class="sw" style="background:${c}"></span>${t}</span>`).join("");
  fill(); render();
}
let timer = null;
document.getElementById("play").onclick = () => {
  if (timer) { clearInterval(timer); timer = null; }
  else timer = setInterval(() => { i = (i + 1) % N; render(); }, 150);
  setLang();
};
document.getElementById("lang").onclick = () => { lang = lang === "ko" ? "en" : "ko"; setLang(); };
slider.oninput = () => { i = +slider.value; render(); };
// drag to orbit, wheel to zoom
let drag = null;
views.addEventListener("pointerdown", e => { if (e.target.tagName === "CANVAS") drag = [e.clientX, e.clientY]; });
addEventListener("pointerup", () => drag = null);
addEventListener("pointermove", e => {
  if (!drag) return;
  cam.yaw -= (e.clientX - drag[0]) * 0.006; cam.pitch = Math.max(0.05, Math.min(1.4, cam.pitch + (e.clientY - drag[1]) * 0.006));
  drag = [e.clientX, e.clientY]; render();
});
views.addEventListener("wheel", e => { e.preventDefault(); cam.dist = Math.max(5, Math.min(30, cam.dist * (e.deltaY > 0 ? 1.1 : 0.9))); render(); }, { passive: false });
addEventListener("resize", render);
setLang();
if (Q.get("still") !== "1" && Q.get("t") === null) document.getElementById("play").click();
</script>
</body>
</html>
