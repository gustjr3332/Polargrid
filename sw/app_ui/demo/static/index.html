<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PolaGrid Demo</title>
<style>
:root{--bg:#0b0f16;--panel:#121923;--line:#1f2a38;--fg:#d7e2ee;--dim:#a9b8c9;--acc:#6cc4f5;--warn:#f0b35a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:16px/1.3 system-ui,Segoe UI,Arial,sans-serif}
#app{display:grid;grid-template-columns:1fr 440px;grid-template-rows:56px 1fr 40px;height:100vh;gap:12px;padding:12px}
header{grid-column:1/3;display:flex;align-items:center;gap:16px}
h1{font-size:22px;margin:0;letter-spacing:.04em}
.badge{background:var(--warn);color:#1a1205;font-weight:700;padding:4px 12px;border-radius:4px;letter-spacing:.08em}
#stage{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%}
aside{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:clamp(8px,1.4vh,14px) 16px;flex:none}
section h2{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.row{display:flex;justify-content:space-between;align-items:baseline;margin:clamp(3px,.6vh,6px) 0}
.row b{font-size:clamp(20px,3vh,30px);font-variant-numeric:tabular-nums;font-weight:600}
.row small{color:var(--dim);font-size:16px}
.bar{position:relative;height:10px;background:#0b0f16;border-radius:5px;margin:4px 0 10px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:5px}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--warn)}
#ctl{display:flex;flex-direction:column;gap:clamp(6px,1vh,10px)}
#clock{font-size:clamp(28px,4vh,40px);font-variant-numeric:tabular-nums;font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button,select{background:#1a2535;color:var(--fg);border:1px solid #2c3d54;border-radius:4px;padding:clamp(5px,.9vh,8px) 14px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
footer{grid-column:1/3;font-size:18px;display:flex;align-items:center;gap:28px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 16px;color:var(--dim)}
footer b{color:var(--fg)}
#mode{background:var(--acc);color:#04202f;font-weight:700;padding:2px 10px;border-radius:3px}
#view{margin-left:auto;font-size:18px;font-weight:700;padding:8px 20px;border-color:var(--acc)}
#lang{font-size:18px;font-weight:700;padding:8px 16px;border:2px solid var(--acc)}#lang b{color:var(--acc)}
#cmp{grid-column:1/3;grid-row:2;display:none;flex-direction:column;justify-content:center;gap:2.5vh;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3vh 3vw;min-height:0}
body.cmp #cmp{display:flex} body.cmp #stage,body.cmp aside{display:none}
#cmp h2{margin:0;font-size:clamp(28px,4vh,44px);color:#fff}
#cmp table{border-collapse:collapse;width:100%;font-size:clamp(22px,3.3vh,36px);color:#fff;font-variant-numeric:tabular-nums}
#cmp th,#cmp td{padding:1.4vh 1vw;border-bottom:2px solid #2c3d54;text-align:right}
#cmp th:first-child,#cmp td:first-child{text-align:left}
#cmp thead th{white-space:nowrap;font-size:clamp(20px,2.8vh,30px);vertical-align:bottom}
#cmp .ai{background:#173049}
#cmp .na{color:var(--warn);font-size:.7em}
#cmp td small{display:block;font-size:.62em;color:#c3cfdc}
#cmp p{margin:0;font-size:clamp(20px,2.8vh,30px);color:#fff}
#cmp .lim{color:var(--warn);font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header><h1>PolaGrid</h1><span class="badge" data-i18n="DEMO DATA"></span><span style="color:var(--dim)" data-i18n="1,000 virtual cells"></span><button id="view"></button><button id="lang" title="Language / 언어"></button></header>
  <div id="cmp"><h2 data-i18n="Glare and desk light: PolaGrid AI vs. common methods"></h2>
    <table><thead></thead><tbody></tbody></table>
    <p class="lim" data-i18n="Simulated room, not measured on hardware."></p><p id="cmp-src"></p></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <aside>
    <section><h2 data-i18n="Desk illuminance"></h2>
      <div class="row"><span data-i18n="Desk A"></span><b id="d0">-</b><small>lux</small></div>
      <div class="bar"><i id="b0"></i><u id="t0"></u></div>
      <div class="row"><span data-i18n="Desk B"></span><b id="d1">-</b><small>lux</small></div>
      <div class="bar"><i id="b1"></i><u id="t1"></u></div>
      <div class="row"><span data-i18n="Glare index"></span><b id="gl">-</b><small data-i18n="h (cumulative)"></small></div>
      <div class="row"><small data-i18n="Target line (demo setting)"></small><small id="tg"></small></div>
    </section>
    <section><h2 data-i18n="Command to applied"></h2>
      <div class="row"><span data-i18n="Latency p50"></span><b id="p50">-</b><small>ms</small></div>
      <div class="row"><span data-i18n="Latency p95"></span><b id="p95">-</b><small>ms</small></div>
      <div class="row"><span data-i18n="Servo moves"></span><b id="mv">-</b><small data-i18n="total"></small></div>
    </section>
    <section><h2 data-i18n="Simulated time"></h2><div id="clock">--:--</div></section>
    <section id="ctl"><h2 data-i18n="Simulation"></h2>
      <div class="btns"><button id="run"></button>
        <select id="spd"><option value="1">1x</option><option value="2">2x</option><option value="5">5x</option><option value="10">10x</option></select></div>
      <div class="btns"><button id="ev-cloud" data-i18n="Cloud"></button><button id="ev-turn" data-i18n="Turn window"></button><button id="ev-reset" data-i18n="Reset"></button></div>
      <div style="color:var(--dim)" id="evs"></div>
    </section>
  </aside>
  <footer>
    <span><span data-i18n="Connection:"></span> <span id="mode"></span></span>
    <span><span data-i18n="Cells:"></span> <b id="nc">1000</b></span>
    <span><span data-i18n="Run:"></span> <b id="run-id">demo-0</b></span>  </footer>
</div>
<script>
"use strict";
const ROWS = 25, COLS = 40, N = ROWS * COLS, TARGET = 500, RUN_ID = "demo-0";
const $ = id => document.getElementById(id);
// ---- language: Korean default, ?lang=en|ko overrides, button toggles live. Technical terms stay English inside Korean text. ----
const KO = {
"DEMO DATA":"데모 데이터","1,000 virtual cells":"가상 셀 1,000개","Comparison table":"비교 표","1,000 cells":"셀 1,000개 화면",
"Glare and desk light: PolaGrid AI vs. common methods":"Glare와 책상 밝기: PolaGrid AI와 기존 방식 비교",
"Simulated room, not measured on hardware.":"시뮬레이션 방입니다. 실물 하드웨어로 측정한 값이 아닙니다.",
"Desk illuminance":"책상 조도","Desk A":"책상 A","Desk B":"책상 B","Glare index":"Glare 지수","h (cumulative)":"h (누적)","Target line (demo setting)":"목표선 (데모 설정)",
"Command to applied":"명령 → 적용까지","Servo moves":"Servo 동작","total":"누적",
"Simulated time":"시뮬레이션 시각","Simulation":"시뮬레이션","Start":"시작","Stop":"정지","Cloud":"구름","Turn window":"창문 방향 돌리기","Reset":"초기화",
"Events:":"이벤트:","none":"없음","Connection:":"연결:","Cells:":"셀:","Run:":"실행:","Live":"실시간","Replay":"녹화 재생",
"desk-hours per day, lower is better":"하루 desk-hours, 낮을수록 좋음","Desk too dark":"책상이 너무 어두움",
"desk-hours per day below 500 lux, sun up":"해가 떠 있는 동안 500 lux 미만인 하루 desk-hours","Mean desk light":"책상 평균 밝기",
"Motor moves":"모터 동작","per day":"하루 기준","Fixed open":"항상 열림","Blinds":"블라인드","Time schedule":"시간표 방식","not measured":"측정 안 함",
"Per-day averages; desk-hours are summed over both desks.":"하루 평균이며, desk-hours는 책상 두 개를 합산한 값입니다.",
"compare.json not found: run make_compare.py":"compare.json이 없습니다. make_compare.py를 실행하세요."};
let LANG = "ko";
{ const q = new URLSearchParams(location.search).get("lang"); let s = null;
  try { s = localStorage.getItem("pg-lang"); } catch (e) {}   // storage may be blocked
  LANG = q === "en" || q === "ko" ? q : s === "en" ? "en" : "ko"; }
const T = s => LANG === "ko" ? (KO[s] || s) : s;   // names not in the table (data, e.g. a new method) pass through unchanged
let modeKey = "Replay", cmpData = null;
const cv = $("cv"), g = cv.getContext("2d");
let last = null;

// ---- drawing entry: the only function a future SSE/Live source needs to call ----
function onFrame(f) {
  last = f;
  draw(f);
  $("clock").textContent = (f.t || "").slice(11) || "--:--";
  $("d0").textContent = f.desks[0]; $("d1").textContent = f.desks[1];
  [0, 1].forEach(i => $("b" + i).style.width = Math.min(100, f.desks[i] / (TARGET * 2) * 100) + "%");
  $("gl").textContent = f.glare_h == null ? "-" : f.glare_h.toFixed(1);   // live viewer cannot see glare or command latency
  $("p50").textContent = f.lat_ms ? f.lat_ms.p50 : "-"; $("p95").textContent = f.lat_ms ? f.lat_ms.p95 : "-";
  $("mv").textContent = f.moves;
  $("nc").textContent = f.cells.length;}

function draw(f) {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pad = 16, s = Math.floor(Math.min((r.width - 2 * pad) / COLS, (r.height - 2 * pad) / ROWS));
  const ox = Math.round((r.width - s * COLS) / 2), oy = Math.round((r.height - s * ROWS) / 2);
  g.clearRect(0, 0, r.width, r.height);
  for (let i = 0; i < Math.min(N, f.cells.length); i++) {
    const v = f.cells[i] / 100, x = ox + (i % COLS) * s, y = oy + Math.floor(i / COLS) * s;
    g.fillStyle = `hsl(205,${30 + 60 * v}%,${9 + 66 * v}%)`; // one hue, dark to bright
    g.fillRect(x + 1, y + 1, s - 2, s - 2);
  }
}

// ---- fake frame generator (replace with SSE: es.onmessage = e => onFrame(JSON.parse(e.data))) ----
const sim = { min: 6 * 60, running: false, speed: 1, cloud: false, turn: 0, cells: Array(N).fill(0), com: Array(N).fill(15), moves: 0, glare: 0, evs: [] };
const DAY_REAL_S = 600, TICK_MS = 200; // 10 real minutes = 24 h at 1x

function makeFrame(dtSim) {
  const h = sim.min / 60 % 24;
  const elev = Math.max(0, Math.sin((h - 6) / 12 * Math.PI)); // 0 before 06:00 and after 18:00
  const sunI = elev * (sim.cloud ? .3 : 1);
  const sunCol = ((h - 6) / 12 * COLS + sim.turn) % COLS; // window orientation shifts where the sun lands
  let moved = 0;
  for (let i = 0; i < N; i++) {
    const c = i % COLS, rw = Math.floor(i / COLS);
    let d = Math.abs(c - sunCol); d = Math.min(d, COLS - d);
    const glare = sunI * Math.exp(-(d * d) / 50) * (1 - rw / ROWS * .4);
    const target = elev === 0 ? 15 : Math.max(0, 100 - 100 * glare * 1.1);
    const nv = sim.cells[i] + (target - sim.cells[i]) * .35;
    if (Math.abs(nv - sim.com[i]) >= 12) { moved++; sim.com[i] = nv; } // a servo move = change of 12+ levels since the last move
    sim.cells[i] = nv;
  }
  const avg = (a, b) => { let t = 0, n = 0; for (let r = 0; r < ROWS; r++) for (let c = a; c < b; c++) { t += sim.cells[r * COLS + c]; n++; } return t / n; };
  const lux = [avg(6, 14), avg(26, 34)].map(o => Math.round(60 + 520 * sunI * (0.25 + o / 100 * .75) * (sim.cloud ? 1.6 : 1) + Math.random() * 12));
  const glareNow = sunI * Math.max(avg(6, 14), avg(26, 34)) / 100;
  if (glareNow > .6) sim.glare += dtSim / 60;
  sim.moves += moved;
  const p50 = Math.round(24 + Math.random() * 3 + moved / 40);
  const hh = String(Math.floor(h)).padStart(2, "0"), mm = String(Math.floor(sim.min % 60)).padStart(2, "0");
  return {
    t: `2026-11-04T${hh}:${mm}`, cells: sim.cells.map(Math.round), desks: lux,
    sun: { elev: Math.round(elev * 70), lux: Math.round(100000 * sunI) }, glare_h: +sim.glare.toFixed(2),
    lat_ms: { p50, p95: Math.round(p50 * 1.45 + Math.random() * 3) }, moves: sim.moves
  };
}

function tick() {
  const dtSim = sim.running ? TICK_MS / 1000 * 1440 / DAY_REAL_S * sim.speed : 0;
  sim.min += dtSim;
  onFrame(makeFrame(dtSim));
}

function evNote() { $("evs").textContent = T("Events:") + " " + (sim.evs.length ? sim.evs.map(T).join(", ") : T("none")); }
let live = false;   // true once frames come from a live server: the buttons then drive the zones through POST /api/ctl
const ctl = body => live && fetch("/api/ctl", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).catch(() => {});
$("run").onclick = () => { sim.running = !sim.running; applyLang(); ctl({ running: sim.running }); };
$("spd").onchange = e => { sim.speed = +e.target.value; ctl({ speed: sim.speed }); };
$("ev-cloud").onclick = () => { sim.cloud = true; if (!sim.evs.includes("Cloud")) sim.evs.push("Cloud"); evNote(); ctl({ cloud: 0.8 }); };
$("ev-turn").onclick = () => { sim.turn += 10; sim.evs.push("Turn window"); evNote(); ctl({ turn: sim.turn }); };
$("ev-reset").onclick = () => {
  Object.assign(sim, { min: 6 * 60, cloud: false, turn: 0, moves: 0, glare: 0, evs: [], running: false }); sim.com.fill(15);
  applyLang(); ctl({ reset: true });
};

$("tg").textContent = TARGET + " lux";
$("t0").style.left = $("t1").style.left = "50%"; // bar spans 0..2x target, so target sits at 50%
$("run-id").textContent = RUN_ID;
sim.cells.fill(15);
const t0 = +new URLSearchParams(location.search).get("t"); if (t0) sim.min = t0 * 60; // ?t=12 starts at 12:00 (rehearsal)
addEventListener("resize", () => last && draw(last));

// ---- comparison table (compare.json, built by make_compare.py from the measured baseline CSV) ----
const METRICS = [["glare_h", "Glare", "desk-hours per day, lower is better", 2], ["under_lit_h", "Desk too dark", "desk-hours per day below 500 lux, sun up", 2],
  ["mean_desk_lux", "Mean desk light", "lux", 0], ["servo_moves", "Motor moves", "per day", 0]];
const TAIL = d => d.limits.replace(/^.*?hardware\. /, "");
const SRC = d => LANG === "ko" ? `테스트 ${d.test_days}일, AI는 ${d.train_days}일치로 학습. ${T(TAIL(d))} 출처: ${d.source}`
  : `${d.test_days} test days, AI trained on ${d.train_days} days. ${TAIL(d)} Source: ${d.source}`;
function showCmp() {
  const d = cmpData, cls = m => m.startsWith("AI") ? ' class="ai"' : "";   // class from the raw (English) data name
  if (!d) { document.querySelector("#cmp tbody").innerHTML = `<tr><td class="na">${T("compare.json not found: run make_compare.py")}</td></tr>`; return; }
  document.querySelector("#cmp thead").innerHTML = "<tr><th></th>" + d.rows.map(r => `<th${cls(r.method)}>${T(r.method)}</th>`).join("") + "</tr>";
  document.querySelector("#cmp tbody").innerHTML = METRICS.map(([k, name, unit, dp]) => `<tr><td>${T(name)}<small>${T(unit)}</small></td>` +
    d.rows.map(r => `<td${cls(r.method)}>${r[k] == null ? `<span class="na">${T("not measured")}</span>` : r[k].toFixed(dp)}</td>`).join("") + "</tr>").join("");
  $("cmp-src").textContent = SRC(d);
}
function applyLang() {
  const cmp = document.body.classList.contains("cmp");
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = T(e.dataset.i18n));
  $("view").textContent = T(cmp ? "1,000 cells" : "Comparison table");
  $("run").textContent = T(sim.running ? "Stop" : "Start");
  $("mode").textContent = T(modeKey);
  $("lang").innerHTML = LANG === "ko" ? "<b>한</b> / EN" : "한 / <b>EN</b>";
  evNote(); if (cmp) showCmp();
}
$("lang").onclick = () => { LANG = LANG === "ko" ? "en" : "ko"; try { localStorage.setItem("pg-lang", LANG); } catch (e) {} applyLang(); };
$("view").onclick = () => {
  const on = document.body.classList.toggle("cmp");
  applyLang();
  if (!on) { last && draw(last); return; }
  fetch("/compare.json").then(r => r.json()).then(d => { cmpData = d; showCmp(); }).catch(() => { cmpData = null; showCmp(); });
};
applyLang();
const fake = setInterval(tick, TICK_MS);
tick();

// Live/replay from demo/server.py (SSE). The fake generator keeps running until the first real frame arrives.
if (location.protocol.startsWith("http") && !new URLSearchParams(location.search).has("fake")) {
  const es = new EventSource("/api/events");
  es.onmessage = e => {
    const f = JSON.parse(e.data);
    clearInterval(fake);
    document.querySelector(".badge").style.display = "none";
    live = f.mode === "live";
    document.querySelector("#ctl").style.display = live ? "" : "none";   // a recording cannot react to buttons
    modeKey = f.mode === "live" ? "Live" : "Replay"; $("mode").textContent = T(modeKey);
    $("run-id").textContent = f.mode;
    onFrame(f);
  };
}
</script>
</body>
</html>
